version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: jiujitsu_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jiujitsu_db}
      MYSQL_USER: ${MYSQL_USER:-jiujitsu_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jiujitsu_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:

